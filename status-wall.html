<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Wall</title><link rel="stylesheet" href="shared/kpi.css"><style>
.wallMeta{display:flex;justify-content:space-between;align-items:center;margin:14px 0;flex-wrap:wrap;gap:10px}
.statRow{display:flex;gap:28px;align-items:baseline}
.statRow .stat b{font-size:24px;font-weight:850;margin-right:7px}
.statRow .stat{color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:800}
.flaggedRow td{color:#8b1f1f;font-weight:700;animation:rowBlink 1s steps(1,end) infinite}
.flaggedRow .flagReasonCell{font-weight:800;color:var(--red)}
.durationCell{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes rowBlink{0%,49%{background-color:#fdecec}50%,100%{background-color:#f6a9a9}}
</style></head><body><div class="wrap">
<header class="header"><div><img class="lobLogo" src="shared/img/lofty-logo.png" alt="Lofty"><div class="title">Status Wall</div><div class="sub">Live rep status · flagged for late login, break over 15 min, or lunch over 60 min · America/New_York</div></div></header>
<div class="wallMeta"><div class="statRow" id="cards"></div><div class="sub" id="meta"></div></div>
<div id="message" class="message" hidden></div>
<div class="tableWrap"><table><thead><tr><th>Employee</th><th>Status</th><th>Duration</th><th>Flag</th></tr></thead><tbody id="wallBody"></tbody></table></div>
</div>
<script type="module">
const params=new URLSearchParams(location.search);
async function api(path){const response=await fetch(path+(path.includes('?')?'&':'?')+`_=${Date.now()}`,{credentials:'same-origin'});const text=await response.text();let data;try{data=text?JSON.parse(text):{}}catch(_){data={}}if(!response.ok)throw Object.assign(new Error(data.error||response.statusText),{status:response.status,response:data});return data}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDuration(totalSeconds){const s=Math.max(0,Math.floor(totalSeconds)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`}
let rows=[];
// Sort tiers, top to bottom: Flagged (late login / break or lunch exceeded) > Long Call (on an
// online status over 15 min, not otherwise flagged) > Avail (online, under 15 min) > everything
// else (break/lunch/offline/offline task/not started/off shift/clocked-in-no-status).
function computeLive(row,now){
  if(!row.sinceIso)return{row,flagged:false,flagReason:'',elapsedSec:null};
  const elapsedSec=(now-new Date(row.sinceIso).getTime())/1000;
  const overCap=row.capMinutes!=null&&elapsedSec/60>row.capMinutes;
  const flagged=row.lateFlag||overCap;
  const flagReason=row.lateFlag?'Late Login':(overCap?(row.capMinutes===15?'Break Exceeded':'Lunch Exceeded'):'');
  return{row,flagged,flagReason,elapsedSec};
}
function tierOf(c){
  if(c.flagged)return 0;
  if(c.row.online&&c.elapsedSec!=null&&c.elapsedSec/60>15)return 1;
  if(c.row.online)return 2;
  return 3;
}
function tick(){
  const now=Date.now();
  const computed=rows.map(r=>computeLive(r,now));
  computed.sort((a,b)=>{
    const t=tierOf(a)-tierOf(b);
    if(t!==0)return t;
    const ea=a.elapsedSec??-1,eb=b.elapsedSec??-1;
    if(eb!==ea)return eb-ea;
    return a.row.employeeName.localeCompare(b.row.employeeName);
  });
  document.getElementById('wallBody').innerHTML=computed.map(c=>{
    const r=c.row,durationText=c.elapsedSec!=null?formatDuration(c.elapsedSec):'—';
    return`<tr class="${c.flagged?'flaggedRow':''}"><td><b>${esc(r.employeeName)}</b><br><span class="muted">${esc(r.teamLeadName)}</span></td><td>${esc(r.statusLabel)}</td><td class="durationCell">${durationText}</td><td class="flagReasonCell">${esc(c.flagReason)}</td></tr>`;
  }).join('')||'<tr><td colspan="4">No reps are currently on shift or reporting in.</td></tr>';
  const flaggedCount=computed.filter(c=>c.flagged).length;
  document.getElementById('cards').innerHTML=[['Total Reps',rows.length],['Flagged',flaggedCount],['On Track',rows.length-flaggedCount]].map(([a,b])=>`<div class="stat"><b>${b}</b>${a}</div>`).join('');
}
function setMessage(text,type){const el=document.getElementById('message');el.className=`message ${type||''}`;el.textContent=text;el.hidden=!text}
async function load(){
  try{
    const key=params.get('key')?`?key=${encodeURIComponent(params.get('key'))}`:'';
    const data=await api(`/api/status-wall${key}`);
    rows=data.rows||[];
    tick();
    document.getElementById('meta').textContent=`Updated ${new Date(data.generatedAt).toLocaleTimeString()}`;
    setMessage('')
  }catch(error){
    setMessage(error.status===401?'This link is not authorized. Ask your administrator for the correct Status Wall link.':`Could not load status wall. ${error.response?.error||error.message}`,'error')
  }
}
load();
setInterval(load,15000);
setInterval(tick,1000);
</script>
<div class="appCredit">Built by Mac · V1.0.0 · &copy; 2026 Lofty. All Rights Reserved.</div>
</body></html>
