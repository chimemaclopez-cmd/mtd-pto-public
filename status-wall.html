<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Wall</title><link rel="stylesheet" href="shared/kpi.css"><style>
.wallMeta{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.flaggedRow td{background:#fdecec!important;color:#8b1f1f}
.flaggedRow .flagReasonCell{font-weight:800;color:var(--red)}
.durationCell{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style></head><body><div class="wrap">
<header class="header"><div><img class="lobLogo" src="shared/img/lofty-logo.png" alt="Lofty"><div class="title">Status Wall</div><div class="sub">Live rep status · flagged for late login, break over 15 min, or lunch over 60 min · America/New_York</div></div></header>
<div class="wallMeta"><div class="cards" id="cards" style="margin:0"></div><div class="sub" id="meta"></div></div>
<div id="message" class="message" hidden></div>
<div class="tableWrap"><table><thead><tr><th>Employee</th><th>Status</th><th>Duration</th><th>Flag</th></tr></thead><tbody id="wallBody"></tbody></table></div>
</div>
<script type="module">
const params=new URLSearchParams(location.search);
async function api(path){const response=await fetch(path+(path.includes('?')?'&':'?')+`_=${Date.now()}`,{credentials:'same-origin'});const text=await response.text();let data;try{data=text?JSON.parse(text):{}}catch(_){data={}}if(!response.ok)throw Object.assign(new Error(data.error||response.statusText),{status:response.status,response:data});return data}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDuration(totalSeconds){const s=Math.max(0,Math.floor(totalSeconds)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`}
let rows=[];
function render(){
  document.getElementById('wallBody').innerHTML=rows.map(r=>`<tr data-wall-row="${esc(r.employeeEmail)}"><td><b>${esc(r.employeeName)}</b><br><span class="muted">${esc(r.teamLeadName)}</span></td><td class="statusCell">${esc(r.statusLabel)}</td><td class="durationCell">—</td><td class="flagReasonCell"></td></tr>`).join('')||'<tr><td colspan="4">No reps are currently on shift or reporting in.</td></tr>';
  tick();
}
function tick(){
  const now=Date.now();
  let flaggedCount=0;
  document.querySelectorAll('[data-wall-row]').forEach(tr=>{
    const row=rows.find(r=>r.employeeEmail===tr.dataset.wallRow);
    if(!row)return;
    if(!row.sinceIso){tr.classList.remove('flaggedRow');return}
    const elapsedSec=(now-new Date(row.sinceIso).getTime())/1000;
    const overCap=row.capMinutes!=null&&elapsedSec/60>row.capMinutes;
    const flagged=row.lateFlag||overCap;
    const flagReason=row.lateFlag?'Late Login':(overCap?(row.capMinutes===15?'Break Exceeded':'Lunch Exceeded'):'');
    tr.querySelector('.durationCell').textContent=formatDuration(elapsedSec);
    tr.querySelector('.flagReasonCell').textContent=flagReason;
    tr.classList.toggle('flaggedRow',flagged);
    if(flagged)flaggedCount++;
  });
  document.getElementById('cards').innerHTML=[['Total Reps',rows.length],['Flagged',flaggedCount],['On Track',rows.length-flaggedCount]].map(([a,b])=>`<div class="card"><div class="label">${a}</div><div class="value">${b}</div></div>`).join('');
}
function setMessage(text,type){const el=document.getElementById('message');el.className=`message ${type||''}`;el.textContent=text;el.hidden=!text}
async function load(){
  try{
    const key=params.get('key')?`?key=${encodeURIComponent(params.get('key'))}`:'';
    const data=await api(`/api/status-wall${key}`);
    rows=data.rows||[];
    render();
    document.getElementById('meta').textContent=`Updated ${new Date(data.generatedAt).toLocaleTimeString()}`;
    setMessage('')
  }catch(error){
    setMessage(error.status===401?'This link is not authorized. Ask your administrator for the correct Status Wall link.':`Could not load status wall. ${error.response?.error||error.message}`,'error')
  }
}
load();
setInterval(load,15000);
setInterval(tick,1000);
</script>
</body></html>
