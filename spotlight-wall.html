async function api(path){const response=await fetch(path+(path.includes('?')?'&':'?')+`_=${Date.now()}`,{credentials:'same-origin'});const text=await response.text();let data;try{data=text?JSON.parse(text):{}}catch(_){data={}}if(!response.ok)throw Object.assign(new Error(data.error||response.statusText),{status:response.status,response:data});return data}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

document.getElementById('soundToggle').onclick=()=>{soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off'};
let audioCtx=null;
function playNotes(notes,{gainPeak=0.22,type='sine'}={}){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    notes.forEach(([freq,delay,dur=.5])=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type=type;osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(gainPeak,now+delay+.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now+delay);osc.stop(now+delay+dur+.05);
    });
  }catch(_){}
}
// Normal ding for saves and general new-item detection.
function chime(){playNotes([[880,0],[1174.66,.12],[1567.98,.24]],{gainPeak:0.22})}
// A good customer rating deserves to cut through - louder and richer (a fuller triumphant

function loudChime(){
  playNotes([
    [523.25,0,.35],[659.25,.1,.35],[783.99,.2,.35],[1046.5,.32,.7],

  ],{gainPeak:0.55});
}
// "Happy Birthday to You" opening phrase, played on a synthesized tone (public-domain

function birthdayChime(){

  playNotes(notes.map((freq,i)=>[freq,i*0.32,0.4]),{gainPeak:0.45,type:'triangle'});
}
const CONFETTI_EMOJI=['🎉','🎊','⭐','✨','🥳'];
function burstConfetti(){
  const layer=document.getElementById('confettiLayer');
  for(let i=0;i<22;i++){
    const el=document.createElement('div');
    el.className='confettiPiece';
    el.textContent=CONFETTI_EMOJI[Math.floor(Math.random()*CONFETTI_EMOJI.length)];

    el.style.animationDuration=`${2.2+Math.random()*1.6}s`;
    el.style.animationDelay=`${Math.random()*.4}s`;
    layer.appendChild(el);
    setTimeout(()=>el.remove(),4200);

}

// Deterministic day-based shuffle so the rotation feels different every day instead of
// re-randomizing (and risking repeats) on every 15s poll - same seed all day, reshuffles at
// local midnight.
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todaySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function shuffledForToday(items){const rng=mulberry32(todaySeed()),arr=[...items];for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
let todaysFillerSeed=todaySeed(),todaysFiller=shuffledForToday(FILLER_ITEMS),fillerCursor=0;
function nextFillerItem(){
  const seed=todaySeed();
  if(seed!==todaysFillerSeed){todaysFillerSeed=seed;todaysFiller=shuffledForToday(FILLER_ITEMS);fillerCursor=0}
  const item=todaysFiller[fillerCursor%todaysFiller.length];
  fillerCursor++;
  return item;
}
function todaysFillerList(){
  const seed=todaySeed();
  if(seed!==todaysFillerSeed){todaysFillerSeed=seed;todaysFiller=shuffledForToday(FILLER_ITEMS);fillerCursor=0}
  return todaysFiller;
}

function sizeFor(text,tier){
  const len=(text||'').length;
  if(tier==='name')return len>22?'sizeL':'sizeXL';
  return len>140?'sizeM':len>70?'sizeL':'sizeXL';
}
function slideForItem(item){
  if(item.kind==='shoutout')return `<div class="slide"><div class="slideIcon">🌟</div><div class="slideBadge badge-gold">Customer Shoutout${item.mentionsName?' · Named by Customer':''}</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div><div class="slideBody isQuote ${sizeFor(item.comment,'body')}">${esc(item.comment)}</div><div class="slideMeta">${esc(item.subject)} · #${item.ticketId}</div></div>`;
  if(item.kind==='save')return `<div class="slide"><div class="slideIcon">🔄</div><div class="slideBadge badge-teal">Save of the Day</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div>${item.comment?`<div class="slideBody isQuote ${sizeFor(item.comment,'body')}">${esc(item.comment)}</div>`:'<div class="slideBody sizeL">Turned an unhappy customer into a happy one today.</div>'}<div class="slideMeta">${esc(item.subject)} · #${item.ticketId}</div></div>`;
  if(item.kind==='birthday')return `<div class="slide"><div class="slideIcon">🎂</div><div class="slideBadge badge-purple">Birthday</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div><div class="slideMeta">${item.daysUntil===0?'Today! 🎉':item.daysUntil===1?'Tomorrow':`In ${item.daysUntil} days`}</div></div>`;
  if(item.kind==='anniversary')return `<div class="slide"><div class="slideIcon">🏆</div><div class="slideBadge badge-purple">Work Anniversary</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div><div class="slideBody sizeL">${item.years} year${item.years===1?'':'s'} at Lofty</div><div class="slideMeta">${item.daysUntil===0?'Today! 🎉':item.daysUntil===1?'Tomorrow':`In ${item.daysUntil} days`}</div></div>`;
  if(item.kind==='weather'){
    const icon=item.level==='warning'?'⛈️':item.level==='caution'?'🌦️':'☀️';
    const badgeStyle=item.level==='warning'?'background:#fde3e3;color:#a11d1d':item.level==='caution'?'background:#fff2cc;color:#8a5a00':'background:#dbe4ff;color:#2e46b8';
    const tempLine=(item.tempMax!=null&&item.tempMin!=null)?`${Math.round(item.tempMin)}°–${Math.round(item.tempMax)}°C · ${esc(item.condition)}`:esc(item.condition||'');
    const outlookLine=item.metroManilaOutlook?`<div class="slideMeta" style="margin-top:8px;opacity:.65">Metro Manila outlook: ${esc(item.metroManilaOutlook)}</div>`:'';
    return `<div class="slide"><div class="slideIcon">${icon}</div><div class="slideBadge badge-purple" style="${badgeStyle}">Weather · ${esc(item.city)}</div><div class="slideBody sizeL">${esc(item.advisory)}</div><div class="slideMeta">${tempLine}</div>${outlookLine}</div>`;
  }
  if(item.kind==='leaders')return`<div class="slide"><div class="slideIcon">📞</div><div class="slideBadge badge-purple" style="background:#dbe4ff;color:#2e46b8">Call Volume Leaders</div><div class="leaderBoard">${item.callLeaders.map((l,i)=>`<div class="leaderRow"><div class="leaderMedal">${['🥇','🥈','🥉','🏅','🏅'][i]||'🏅'}</div><div class="leaderName">${esc(l.employeeName)}</div><div class="leaderStats">${l.accepted} calls${l.longCalls?` · ${l.longCalls} long`:''}</div></div>`).join('')}</div></div>`;
  if(item.type==='lofty')return `<div class="slide"><div class="slideIcon">📣</div><div class="slideBadge badge-purple" style="background:#dbe4ff;color:#2e46b8">What's New in Lofty · ${esc(item.attr)}</div>${item.image?`<img class="fillerImg" src="${esc(item.image)}" alt="">`:''}<div class="slideBody ${sizeFor(item.text,'body')}">${esc(item.text)}</div></div>`;
  const icon=item.type==='quote'?'💬':item.type==='security'?'🛡️':'💡';
  const label=item.type==='quote'?'Worth Remembering':item.type==='security'?'Security Tip':'Good to Know';
  return `<div class="slide"><div class="slideIcon">${icon}</div><div class="slideBadge badge-purple">${label}</div><div class="slideBody ${item.type==='quote'?'isQuote':''} ${sizeFor(item.text,'body')}">${esc(item.text)}</div>${item.attr?`<div class="slideMeta">— ${esc(item.attr)}</div>`:''}</div>`;
}

let queue=[],queueIndex=0,rotateTimer=null;
// Keys that have already had their sound+confetti played - separate from "have we ever seen
// this item" so a brand-new shoutout/save keeps its "announce me" flag alive across however
// many 15s polls happen before the carousel actually rotates to it (polls run 2x as often as
// slide changes), instead of firing the sound the instant it's detected in the background
// while a completely different slide is on screen.
const announcedKeys=new Set();
let firstLoad=true;

function keyFor(item){
  if(item.kind==='shoutout'||item.kind==='save')return `${item.kind}:${item.ticketId}`;
  if(item.kind==='birthday'||item.kind==='anniversary')return `${item.kind}:${item.employeeName}:${item.daysUntil}`;
  return null;
}
function buildQueue(spotlight){
  const shoutouts=(spotlight.shoutouts||[]).map(x=>({...x,kind:'shoutout'}));
  const saves=(spotlight.saves||[]).map(x=>({...x,kind:'save'}));
  const birthdays=(spotlight.celebrations?.birthdays||[]).map(x=>({...x,kind:'birthday'}));
  const anniversaries=(spotlight.celebrations?.anniversaries||[]).map(x=>({...x,kind:'anniversary'}));
  const callLeaders=spotlight.callLeaders||[];
  // Weather always leads the rotation (not woven in as random filler) since it's daily
  // commute-safety info reps should reliably see, not something that should get crowded out.
  const weatherItem=spotlight.weather?[{...spotlight.weather,kind:'weather'}]:[];
  const real=[...weatherItem,...shoutouts,...saves,...birthdays,...anniversaries];
  if(callLeaders.length)real.splice(Math.min(3,real.length),0,{kind:'leaders',callLeaders});
  for(const item of real){const k=keyFor(item);if(k)item.pendingAnnounce=!announcedKeys.has(k)}
  if(!real.length)return{list:todaysFillerList().map(x=>({...x}))};
  // Weave in one filler item every 3 real items so the wall stays varied even on a busy day.
  const woven=[];
  real.forEach((item,i)=>{woven.push(item);if((i+1)%3===0)woven.push(nextFillerItem())});
  // On a quiet day (e.g. just the weather slide, real.length===1) the modulo-3 weave above
  // never fires, so the queue would otherwise be a single slide forever - pad it out with
  // filler so quotes/tips/Lofty updates keep rotating regardless of how few real items exist.
  const MIN_QUEUE_LENGTH=8;
  while(woven.length<MIN_QUEUE_LENGTH)woven.push(nextFillerItem());
  return{list:woven};
}
function showSlide(index){
  if(!queue.length)return;
  const item=queue[index];
  document.getElementById('stage').innerHTML=slideForItem(item);
  document.getElementById('dots').innerHTML=queue.map((_,i)=>`<div class="dot${i===index?' active':''}"></div>`).join('');
  const bar=document.getElementById('progressBar');
  bar.classList.remove('run');void bar.offsetWidth;bar.style.animationDuration=`${ROTATE_MS}ms`;bar.classList.add('run');
  // Every sound is tied to the slide actually being on screen right now, never to background
  // polling, so what you hear always matches what you're looking at.
  if(item.kind==='birthday'&&item.daysUntil===0){birthdayChime();burstConfetti()}
  else if(item.pendingAnnounce&&firstLoad===false){
    const k=keyFor(item);
    if(item.kind==='shoutout'){loudChime();burstConfetti()}
    else if(item.kind==='save'){chime();burstConfetti()}
    if(k)announcedKeys.add(k);
  }
}
function startRotation(){
  clearInterval(rotateTimer);
  queueIndex=0;showSlide(0);
  rotateTimer=setInterval(()=>{queueIndex=(queueIndex+1)%queue.length;showSlide(queueIndex)},ROTATE_MS);
}

async function load(){
  try{
    const key=params.get('key')?`?key=${encodeURIComponent(params.get('key'))}`:'';
    const data=await api(`/api/spotlight-wall${key}`);
    const spotlight=data.spotlight||{};
    const{list}=buildQueue(spotlight);
    queue=list;
    if(firstLoad){
      // On the very first load, mark everything already visible as "announced" so the wall
      // doesn't fire a chime for every pre-existing item the moment it opens - only genuinely
      // new arrivals after that get the sound.
      queue.forEach(item=>{const k=keyFor(item);if(k)announcedKeys.add(k)});
      startRotation();firstLoad=false;
    }
    if(queueIndex>=queue.length)queueIndex=0;
    setMessage('','')
  }catch(error){
    setMessage(error.status===401?'This link is not authorized. Ask your administrator for the correct Spotlight Wall link.':`Could not load Spotlight Wall. ${error.response?.error||error.message}`,'error')
  }
}
function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString()}
load();
setInterval(load,15000);
tickClock();
setInterval(tickClock,1000);
</script>
</body></html>
