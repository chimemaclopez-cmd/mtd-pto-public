// This page is meant to stay open on a TV all day (or longer) without ever being manually
// refreshed - but a 15s data poll only refreshes DATA, not the code itself, so a code deploy
// (new filler content, a bug fix, etc.) would otherwise sit invisible until someone happens to
// reload the tab. Bump this string on every deploy; the periodic check near the bottom of this
// file compares it against whatever is currently live and force-reloads when they differ.
const SW_VERSION='2026-08-27.1';
async function api(path){const response=await fetch(path+(path.includes('?')?'&':'?')+`_=${Date.now()}`,{credentials:'same-origin'});const text=await response.text();let data;try{data=text?JSON.parse(text):{}}catch(_){data={}}if(!response.ok)throw Object.assign(new Error(data.error||response.statusText),{status:response.status,response:data});return data}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setMessage(text,type){const el=document.getElementById('message');el.className=`message ${type||''}`;el.textContent=text;el.hidden=!text}

let soundOn=true;
document.getElementById('soundToggle').onclick=()=>{soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off'};
let audioCtx=null;
function playNotes(notes,{gainPeak=0.22,type='sine'}={}){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    notes.forEach(([freq,delay,dur=.5])=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type=type;osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.0001,now+delay);
      gain.gain.exponentialRampToValueAtTime(gainPeak,now+delay+.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now+delay);osc.stop(now+delay+dur+.05);
    });
  }catch(_){}
}
// Normal ding for saves and general new-item detection.
function chime(){playNotes([[880,0],[1174.66,.12],[1567.98,.24]],{gainPeak:0.22})}
// A good customer rating deserves to cut through - louder and richer (a fuller triumphant
// run with a doubled low note for extra body) so it actually grabs attention on the floor.
function loudChime(){
  playNotes([
    [523.25,0,.35],[659.25,.1,.35],[783.99,.2,.35],[1046.5,.32,.7],
    [523.25,.32,.7]
  ],{gainPeak:0.55});
}
// A CSAT rating with real customer words - especially one naming the rep - earns a bright,
// upbeat little arpeggio that loops for the entire time the slide is on screen. A flat held
// chord read as a siren/alarm, and a repeated identical burst read as clicking - a short
// melodic run that loops smoothly (notes overlap via a soft release rather than sounding like
// discrete taps) reads as genuinely celebratory instead.
let celebrationTimer=null;
const CELEBRATION_MOTIF=[523.25,659.25,783.99,1046.5,783.99,659.25]; // C5 E5 G5 C6 G5 E5, up and back down
function celebrationChime(durationMs){
  clearTimeout(celebrationTimer);
  if(!soundOn)return;
  const dwell=durationMs||4000,noteSec=.17,motifMs=(CELEBRATION_MOTIF.length*noteSec+.25)*1000;
  const loop=elapsed=>{
    if(elapsed>=dwell)return;
    playNotes(CELEBRATION_MOTIF.map((freq,i)=>[freq,i*noteSec,noteSec*1.4]),{gainPeak:0.4,type:'triangle'});
    celebrationTimer=setTimeout(()=>loop(elapsed+motifMs),motifMs);
  };
  loop(0);
}
// "Happy Birthday to You" opening phrase, played on a synthesized tone (public-domain
// melody, no lyrics) - triggers only when a birthday slide for TODAY comes into view.
// The real "Happy Birthday to You" melody, all four lines (the first version here only had
// the first two, looped, with flat equal-spaced timing) - each line's short-short-long
// rhythm (the "Hap-py birth-day" pickup vs. the held "...to you") comes from real per-note
// durations feeding cumulative delays, not a uniform spacing between notes.
function birthdayChime(){
  const G4=392.00,A4=440.00,B4=493.88,C5=523.25,D5=587.33,E5=659.25,F5=698.46,G5=783.99;
  let t=0;const notes=[];
  const line=(freqs,durs)=>{freqs.forEach((f,i)=>{notes.push([f,t,durs[i]]);t+=durs[i]*0.85});t+=0.15};
  line([G4,G4,A4,G4,C5,B4],[0.28,0.22,0.5,0.5,0.5,0.9]);
  line([G4,G4,A4,G4,D5,C5],[0.28,0.22,0.5,0.5,0.5,0.9]);
  line([G4,G4,G5,E5,C5,B4,A4],[0.28,0.22,0.5,0.5,0.5,0.5,0.9]);
  line([F5,F5,E5,C5,D5,C5],[0.28,0.22,0.5,0.5,0.5,1.1]);
  playNotes(notes,{gainPeak:0.45,type:'triangle'});
}
const CONFETTI_EMOJI=['🎉','🎊','⭐','✨','🥳'];
function burstConfetti(){
  const layer=document.getElementById('confettiLayer');
  for(let i=0;i<22;i++){
    const el=document.createElement('div');
    el.className='confettiPiece';
    el.textContent=CONFETTI_EMOJI[Math.floor(Math.random()*CONFETTI_EMOJI.length)];

    el.style.animationDuration=`${2.2+Math.random()*1.6}s`;
    el.style.animationDelay=`${Math.random()*.4}s`;
    layer.appendChild(el);
    setTimeout(()=>el.remove(),4200);
  }
}

  {type:'lofty',attr:'Lofty 4.47',text:'One click now generates a fully branded AI listing video in about 5 minutes, no photo picking or templates needed - Social Agent plans include 3 free per month.',image:'https://help.lofty.com/hc/article_attachments/53162945796379'},
  {type:'lofty',attr:'Lofty 4.47',text:'Your AI Sales Agent now asks for your one-tap approval before locking in any appointment a lead requests, so nothing lands on your calendar without your OK.'},
  {type:'lofty',attr:'Lofty 4.47',text:'You can now choose whether your AI Sales Agent proactively tells leads it is an AI assistant, or presents itself as a sales assistant instead.',image:'https://help.lofty.com/hc/article_attachments/53162957277595'},
  {type:'lofty',attr:'Lofty 4.47',text:'Smart Plans can now auto-send local market reports to enrolled leads, matched to their city or zip code, on whatever schedule you set.'},
  {type:'lofty',attr:'Lofty 4.47',text:'Next Up lead routing now supports a strict, fixed rotation so leads are handed to agents in a set order instead of an activity-weighted score.',image:'https://help.lofty.com/hc/article_attachments/53163891701403'},
  {type:'lofty',attr:'Lofty 4.47',text:'You can now bulk-postpone multiple tasks (1, 3, 7, or 30 days) or send several leads to Dialer all at once, instead of one at a time.',image:'https://help.lofty.com/hc/article_attachments/53164208085915'},
  {type:'lofty',attr:'Lofty 4.46',text:'A new Troubleshoot tool shows exactly why a lead failed to enroll in a Smart Plan, with a timestamped error log instead of guessing or opening a ticket.',image:'https://help.lofty.com/hc/article_attachments/52489508286107'},
  {type:'lofty',attr:'Lofty 4.46',text:'Smart Plans now show when automated emails or texts were skipped and why (bounced, opted out, DNC), both per-lead and in aggregate on the Performance tab.',image:'https://help.lofty.com/hc/article_attachments/52494927447067'},
  {type:'lofty',attr:'Lofty 4.46',text:"When deleting a team member, you can now reassign their leads to a shared Lead Pond instead of forcing a one-to-one reassignment to another agent.",image:'https://help.lofty.com/hc/article_attachments/52495220101147'},
  {type:'lofty',attr:'Lofty 4.46',text:'Tasks can now recur Quarterly on a specific month and day you choose - handy for quarterly client check-ins and reviews.',image:'https://help.lofty.com/hc/article_attachments/52495358494747'},
  {type:'lofty',attr:'Lofty 4.46',text:"You can now command your AI Sales Agent directly inside Lofty: see its full conversation history, review its planned next action, and redirect it without leaving the CRM.",image:'https://help.lofty.com/hc/article_attachments/52495553329307'},
  {type:'lofty',attr:'Lofty 4.46',text:'Social Agent posts now automatically resize to fit the character limit of whichever platform you are posting to, updating instantly if you switch channels.'},
  {type:'lofty',attr:'Lofty AOS',text:"Lofty AOS (Agent Operating System) is the next generation of the Lofty platform - your CRM, communication, marketing, and AI tools brought together in one workspace, with your leads, history, and settings carrying over unchanged."},
  {type:'lofty',attr:'Lofty AOS',text:'Instead of a classic Dashboard, Lofty AOS opens on Cowork - an AI home page with a live morning briefing, your production numbers, and an Ask Lofty AI box ready for plain-language requests.'},
  {type:'lofty',attr:'Lofty AOS',text:'Lofty AOS groups its AI Copilots - Sales Agent, AI Assistant, Social Agent, and Homeowner Agent - together instead of scattering them across separate features.'},
  {type:'lofty',attr:'Lofty AOS',text:'The Lofty AOS sidebar has three groups: workspace tools up top (Cowork, Search, Inbox, Dialer), your working modules in the middle (CRM, Sales, Marketing, Automation, Website, Reporting), and account tools at the bottom.'},
  {type:'lofty',attr:'Lofty AOS',text:'Clicking the Lofty logo in the top-left corner always takes you back to Cowork, your AI workspace home page, from anywhere in Lofty AOS.'},
  {type:'lofty',attr:'Lofty AOS',text:'In Lofty AOS, your Profile settings feed your email signature and public-facing details - photo, name, phone number, license ID, and social media links all live there.'},
  {type:'lofty',attr:'Lofty AOS',text:"Lofty AOS account security lives under Account & Security: change your password, turn on Two-Factor Authentication, and see (and log out of) every device currently signed into your account."},
  {type:'lofty',attr:'Lofty AOS',text:'Lofty is rolling out AOS in stages, so not every account gets every feature at once - your leads, history, and settings still carry over unchanged either way.'},
  {type:'video',attr:'Lofty AOS',caption:'Your First Time Logging Into Lofty AOS',embed:'https://www.loom.com/embed/81b6bf10a1004191a5fb49ebe4a7df1b?autoplay=1',durationMs:98000},
  {type:'lofty',attr:'Developer Platform',text:"The Lofty Developer Platform lets third-party developers build integrations with Lofty using OAuth 2.0 - they sign up for a developer account at api.lofty.com/vendor, then their app goes through Lofty's review before it can go live for real users."},
  {type:'lofty',attr:'Developer Platform',text:'Once a developer app is live in production, further changes go through a quick Lofty review (2-5 business days) before publishing - adding new permission scopes means existing connected users have to re-authorize the app.'},
  {type:'hr',text:'Attendance is tracked through ESS/Jeonsoft - remember to clock in and out at the start and end of each shift.'},
  {type:'hr',text:'Running late? As a guideline, notify your supervisor at least 1 hour before your shift for expected lateness, and at least 2 hours before for a planned absence.'},
  {type:'hr',text:'If an illness keeps you out more than one day, a medical certificate is expected when you return - the initial call-in itself does not require disclosing the illness.'},
  {type:'hr',text:'Certain days - around payday, weekends, holidays, and the last working day of the month - are treated as Critical Work Days, so unscheduled absences on those days get extra attention.'},
  {type:'hr',text:"Moatable's discipline process is coaching-first and progressive: documented coaching is a developmental step, not a sanction, and generally comes before any formal action."},
  {type:'hr',text:'When formal discipline is needed, it generally follows three stages - Written Warning, Final Warning, and Termination - based on the severity of the concern.'},

// Shuffled fresh with a new random seed every time this page loads (so refreshing gives a
// different order), but the resulting order stays fixed for the rest of this page session -
// rebuildQueue() is still the only thing allowed to advance the cursor, so the sequence never
// re-randomizes mid-session on a background poll.
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffledFillerPool(items){const rng=mulberry32(Math.floor(Math.random()*2**31)),arr=[...items];for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
let todaysFiller=shuffledFillerPool(FILLER_ITEMS),fillerCursor=0;
function nextFillerItem(){
  const item=todaysFiller[fillerCursor%todaysFiller.length];
  fillerCursor++;
  return item;
}
function todaysFillerList(){
  return todaysFiller;
}

function sizeFor(text,tier){
  const len=(text||'').length;
  if(tier==='name')return len>22?'sizeL':'sizeXL';
  return len>140?'sizeM':len>70?'sizeL':'sizeXL';
}
// A rating with no written comment still gets a witty line instead of the same flat filler
// every time - picked by a stable hash of the ticket ID (not Math.random) so the same slide
// shows the same wording every time it re-renders across polls/rotations, instead of the text
// changing under the viewer's eyes each time this slide comes back around.
function stablePick(pool,key){let h=0;const s=String(key||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return pool[Math.abs(h)%pool.length]}
const SHOUTOUT_FALLBACK_LINES=['Left a good rating today - nice work!','Another satisfied customer, no notes needed.','Quietly excellent - a good rating says it all.','No comment needed - the good rating speaks for itself!','Customer approved, no further questions.','Solid work - that good rating didn\'t happen by accident.','Another one in the win column. Nice work!','Good rating, zero drama - just great service.'];
const SAVE_FALLBACK_LINES=['Turned an unhappy customer into a happy one today.','Flipped a bad day into a good rating - that\'s the save of the day!','Walked in to a five-alarm customer and walked out with a smile. Nice save!','Turned frustration into satisfaction - that\'s the job done right.','Rescued this one from a bad ending. Great save!','Started rough, ended great - thanks for turning it around!','Difficult customer, happy ending - nicely handled.'];
function slideForItem(item){
  // A real uploaded profile photo replaces the emoji icon on hero slides - an employee who
  // hasn't uploaded one yet just keeps the icon, no placeholder avatar shown in its place.
  const heroVisual=(icon,photoBase64)=>photoBase64?`<img class="slidePhoto" src="${esc(photoBase64)}" alt="">`:`<div class="slideIcon">${icon}</div>`;
  // A full-bleed poster/banner image, no extra chrome - the image is already the whole
  // message, so wrapping it in a badge/caption would just compete with its own design.
  if(item.kind==='poster')return `<div class="slide"><img class="posterImg" src="${esc(item.image)}" alt="${esc(item.caption||'')}"></div>`;
  if(item.kind==='shoutout'){
    // Every good rating gets a slide, but the ones with real customer words - especially ones
    // naming the rep - get a bigger icon/badge (and, in showSlide, a louder chime + confetti).
    const icon=item.mentionsName?'🏆':item.hasComment?'🌟':'👍';
    const badge=item.mentionsName?'Customer Shoutout · Named by Customer':(item.hasComment?'Customer Shoutout':'Good CSAT Rating');
    const body=item.comment?`<div class="slideBody isQuote ${sizeFor(item.comment,'body')}">${esc(item.comment)}</div>`:`<div class="slideBody sizeL">${esc(stablePick(SHOUTOUT_FALLBACK_LINES,item.ticketId))}</div>`;
    return `<div class="slide">${heroVisual(icon,item.photoBase64)}<div class="slideBadge badge-gold">${badge}</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div>${body}<div class="slideMeta">${esc(item.subject)} · #${item.ticketId}</div></div>`;
  }
  if(item.kind==='save')return `<div class="slide">${heroVisual('🔄',item.photoBase64)}<div class="slideBadge badge-teal">Save of the Day</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div>${item.comment?`<div class="slideBody isQuote ${sizeFor(item.comment,'body')}">${esc(item.comment)}</div>`:`<div class="slideBody sizeL">${esc(stablePick(SAVE_FALLBACK_LINES,item.ticketId))}</div>`}<div class="slideMeta">${esc(item.subject)} · #${item.ticketId}</div></div>`;
  if(item.kind==='birthday')return `<div class="slide">${heroVisual('🎂',item.photoBase64)}<div class="slideBadge badge-purple">Birthday</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div><div class="slideMeta">${item.daysUntil===0?'Today! 🎉':item.daysUntil===1?'Tomorrow':`In ${item.daysUntil} days`}</div></div>`;
  if(item.kind==='anniversary')return `<div class="slide">${heroVisual('🏆',item.photoBase64)}<div class="slideBadge badge-purple">Work Anniversary</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div><div class="slideBody sizeL">${item.years} year${item.years===1?'':'s'} at Lofty</div><div class="slideMeta">${item.daysUntil===0?'Today! 🎉':item.daysUntil===1?'Tomorrow':`In ${item.daysUntil} days`}</div></div>`;
  if(item.kind==='weather'){
    const icon=item.level==='warning'?'⛈️':item.level==='caution'?'🌦️':'☀️';
    const badgeStyle=item.level==='warning'?'background:#fde3e3;color:#a11d1d':item.level==='caution'?'background:#fff2cc;color:#8a5a00':'background:#dbe4ff;color:#2e46b8';
    const tempLine=(item.tempMax!=null&&item.tempMin!=null)?`${Math.round(item.tempMin)}°–${Math.round(item.tempMax)}°C · ${esc(item.condition)}`:esc(item.condition||'');
    const outlookLine=item.metroManilaOutlook?`<div class="slideMeta" style="margin-top:8px;opacity:.65">Metro Manila outlook: ${esc(item.metroManilaOutlook)}</div>`:'';
    return `<div class="slide"><div class="slideIcon">${icon}</div><div class="slideBadge badge-purple" style="${badgeStyle}">Weather · ${esc(item.city)}</div><div class="slideBody sizeL">${esc(item.advisory)}</div><div class="slideMeta">${tempLine}</div>${outlookLine}</div>`;
  }
  if(item.kind==='leaders')return`<div class="slide"><div class="slideIcon">📞</div><div class="slideBadge badge-purple" style="background:#dbe4ff;color:#2e46b8">Call Volume Leaders</div><div class="leaderBoard">${item.callLeaders.map((l,i)=>`<div class="leaderRow"><div class="leaderMedal">${['🥇','🥈','🥉','🏅','🏅'][i]||'🏅'}</div>${l.photoBase64?`<img class="leaderPhoto" src="${esc(l.photoBase64)}" alt="">`:''}<div class="leaderName">${esc(l.employeeName)}</div><div class="leaderStats">${l.accepted} calls${l.longCalls?` · ${l.longCalls} long`:''}</div></div>`).join('')}</div></div>`;
  if(item.kind==='shift-end-thanks')return `<div class="slide">${heroVisual('🙏',item.photoBase64)}<div class="slideBadge badge-teal">Great Shift!</div><div class="slideName ${sizeFor(item.employeeName,'name')}">${esc(item.employeeName)}</div><div class="slideBody sizeL">${esc(item.message)}</div></div>`;
  if(item.kind==='daily-thanks')return `<div class="slide"><div class="slideIcon">🙌</div><div class="slideBadge badge-teal">Thank You, Team!</div><div class="slideBody sizeL">${esc(item.message)}</div></div>`;
  if(item.type==='quiz')return `<div class="slide"><div class="slideIcon">🧠</div><div class="slideBadge badge-purple" style="background:#dbe4ff;color:#2e46b8">Quick Trivia</div><div class="slideBody sizeL">${esc(item.question)}</div><div class="quizOptions">${item.options.map((opt,i)=>`<div class="quizOption" data-idx="${i}">${String.fromCharCode(65+i)}. ${esc(opt)}</div>`).join('')}</div><div class="slideMeta quizReveal" style="opacity:0;margin-top:14px">Correct answer highlighted above</div></div>`;
  if(item.type==='phishing')return `<div class="slide"><div class="slideBadge badge-purple" style="background:#fde3e3;color:#a11d1d">Spot the Phishing Attempt</div><div class="fillerSvgWrap">${item.svg}</div><div class="slideMeta" style="margin-top:14px">${esc(item.caption)}</div></div>`;
  if(item.type==='video')return `<div class="slide slide-video"><div class="slideBadge badge-purple" style="background:#dbe4ff;color:#2e46b8">${esc(item.attr)} Video</div><div class="fillerVideoWrap"><iframe src="${esc(item.embed)}" allow="autoplay; fullscreen" allowfullscreen></iframe></div><div class="slideMeta" style="margin-top:14px">${esc(item.caption)}</div></div>`;
  if(item.type==='reminder')return `<div class="slide"><div class="slideIcon">📌</div><div class="slideBadge" style="background:#fde3e3;color:#a11d1d">Reminder</div><div class="slideBody sizeXL" style="font-weight:900">${esc(item.text)}</div></div>`;
  if(item.type==='lofty')return `<div class="slide"><div class="slideIcon">📣</div><div class="slideBadge badge-purple" style="background:#dbe4ff;color:#2e46b8">What's New in Lofty · ${esc(item.attr)}</div>${item.image?`<img class="fillerImg" src="${esc(item.image)}" alt="">`:''}<div class="slideBody ${sizeFor(item.text,'body')}">${esc(item.text)}</div></div>`;
  const icon=item.type==='quote'?'💬':item.type==='security'?'🛡️':'💡';
  const label=item.type==='quote'?'Worth Remembering':item.type==='security'?'Security Tip':'Good to Know';
  return `<div class="slide"><div class="slideIcon">${icon}</div><div class="slideBadge badge-purple">${label}</div><div class="slideBody ${item.type==='quote'?'isQuote':''} ${sizeFor(item.text,'body')}">${esc(item.text)}</div>${item.attr?`<div class="slideMeta">— ${esc(item.attr)}</div>`:''}</div>`;
}

let queue=[],queueIndex=0,rotateTimer=null;
// Keys that have already had their sound+confetti played - separate from "have we ever seen
// this item" so a brand-new shoutout/save keeps its "announce me" flag alive across however
// many 15s polls happen before the carousel actually rotates to it (polls run 2x as often as
// slide changes), instead of firing the sound the instant it's detected in the background
// while a completely different slide is on screen.
const announcedKeys=new Set();
let firstLoad=true;
// The birthday chime/confetti below fires every time the slideshow rotates back onto that
// slide (no dedup like announcedKeys gives shoutouts) - with a ~25-slide, ~30s/slide queue
// that's roughly every 12-13 minutes, which reads as spammy over a full workday. Throttle it
// to once per 2 hours per person instead, so it still celebrates all day without repeating on
// every loop. Keyed by employeeName only (not the full keyFor(), which bakes in daysUntil) so
// the cooldown survives daysUntil staying 0 all day.
const BIRTHDAY_CELEBRATION_COOLDOWN_MS=2*60*60*1000;
const lastBirthdayCelebrationAt=new Map();
function shouldCelebrateBirthdayNow(item){
  const last=lastBirthdayCelebrationAt.get(item.employeeName)||0;
  if(Date.now()-last<BIRTHDAY_CELEBRATION_COOLDOWN_MS)return false;
  lastBirthdayCelebrationAt.set(item.employeeName,Date.now());
  return true;
}

function keyFor(item){
  if(item.kind==='shoutout'||item.kind==='save')return `${item.kind}:${item.ticketId}`;
  if(item.kind==='birthday'||item.kind==='anniversary')return `${item.kind}:${item.employeeName}:${item.daysUntil}`;
  if(item.kind==='shift-end-thanks')return `shift-end-thanks:${item.employeeEmail}:${item.firedAt}`;
  if(item.kind==='daily-thanks')return `daily-thanks:${item.firedAt}`;
  return null;
}
// Inserted every 4 slots into whatever the rest of the queue is - often enough (roughly every
// 2 minutes at 30s/slide) that these operational reminders can't get lost in a busy or a quiet
// day, independent of how much real/filler content exists.
function withReminders(list){
  const out=[];
  list.forEach((item,i)=>{out.push(item);if((i+1)%4===0)out.push(nextReminderItem())});
  return out;
}
// Special posters (team-culture banners, announcements-as-images) need to show up reliably on
// a real wall-clock cadence, not just whenever the shuffled filler pool happens to land on
// them - so, like weather, they're injected explicitly rather than woven in as random filler.
// lastPosterShownAt starts at 0 ("never this session"), so a freshly loaded/reloaded wall
// (including one force-reloaded by checkForUpdate right after this ships) shows it immediately
// instead of waiting up to an hour.
const SPECIAL_POSTERS=[
  {kind:'poster',image:'shared/img/csat-banner.png',caption:'Where there’s CSAT, there’s us',durationMs:38000}
];
const POSTER_INTERVAL_MS=60*60*1000;
let posterCursor=0,lastPosterShownAt=0;
function maybeInjectPoster(list){
  if(!SPECIAL_POSTERS.length||Date.now()-lastPosterShownAt<POSTER_INTERVAL_MS)return list;
  lastPosterShownAt=Date.now();
  const poster={...SPECIAL_POSTERS[posterCursor%SPECIAL_POSTERS.length]};
  posterCursor++;
  const out=[...list];
  out.splice(Math.min(1,out.length),0,poster);
  return out;
}
function buildQueue(spotlight){
  const shoutouts=(spotlight.shoutouts||[]).map(x=>({...x,kind:'shoutout'}));
  const saves=(spotlight.saves||[]).map(x=>({...x,kind:'save'}));
  const birthdays=(spotlight.celebrations?.birthdays||[]).map(x=>({...x,kind:'birthday'}));
  const anniversaries=(spotlight.celebrations?.anniversaries||[]).map(x=>({...x,kind:'anniversary'}));
  const callLeaders=spotlight.callLeaders||[];
  const shiftEndThanks=(spotlight.shiftEndThanks||[]).map(x=>({...x,kind:'shift-end-thanks'}));
  const dailyThanks=spotlight.dailyThanks?[{...spotlight.dailyThanks,kind:'daily-thanks'}]:[];
  // Weather always leads the rotation (not woven in as random filler) since it's daily
  // commute-safety info reps should reliably see, not something that should get crowded out.
  const weatherItem=spotlight.weather?[{...spotlight.weather,kind:'weather'}]:[];
  // Birthdays/anniversaries are rare, once-a-year "hero" moments, not routine content - queuing
  // them after every shoutout/save/shift-end-thanks (which can easily number in the dozens)
  // meant a birthday could sit unseen for 15+ minutes before its first appearance. They go
  // right after weather so they're reliably caught within the first few slides instead.
  const real=[...weatherItem,...dailyThanks,...birthdays,...anniversaries,...shoutouts,...saves,...shiftEndThanks];
  if(callLeaders.length)real.splice(Math.min(3,real.length),0,{kind:'leaders',callLeaders});
  for(const item of real){const k=keyFor(item);if(k)item.pendingAnnounce=!announcedKeys.has(k)}
  if(!real.length)return{list:maybeInjectPoster(withReminders(todaysFillerList().map(x=>({...x}))))};
  // Weave in one filler item every 3 real items so the wall stays varied even on a busy day.
  const woven=[];
  real.forEach((item,i)=>{woven.push(item);if((i+1)%3===0)woven.push(nextFillerItem())});
  // On a quiet day (e.g. just the weather slide, real.length===1) the modulo-3 weave above
  // never fires, so the queue would otherwise be a single slide forever - pad it out with
  // filler so quotes/tips/Lofty updates keep rotating regardless of how few real items exist.
  // 25 slides at 30s each is a ~12.5 minute cycle before any repeat, drawing from the full
  // ~75-item pool - a big improvement over the original 8 (a 4-minute loop of only 8 items,
  // which read as "just repeating the same few things") for a slow-content day.
  const MIN_QUEUE_LENGTH=25;
  while(woven.length<MIN_QUEUE_LENGTH)woven.push(nextFillerItem());
  return{list:maybeInjectPoster(withReminders(woven))};
}
let quizRevealTimer=null;
function showSlide(index){
  if(!queue.length)return;
  const item=queue[index];
  clearTimeout(quizRevealTimer);
  // A celebration loop from a previous slide must never bleed into this one - always clear it
  // here before deciding whether the new slide starts its own.
  clearTimeout(celebrationTimer);
  document.getElementById('stage').innerHTML=slideForItem(item);
  document.getElementById('dots').innerHTML=queue.map((_,i)=>`<div class="dot${i===index?' active':''}"></div>`).join('');
  const bar=document.getElementById('progressBar');
  bar.classList.remove('run');void bar.offsetWidth;bar.style.animationDuration=`${item.durationMs||ROTATE_MS}ms`;bar.classList.add('run');
  if(item.type==='quiz'){
    quizRevealTimer=setTimeout(()=>{
      document.querySelectorAll('.quizOption').forEach(el=>{if(Number(el.dataset.idx)===item.correct)el.classList.add('correct')});
      const reveal=document.querySelector('.quizReveal');
      if(reveal)reveal.style.opacity='1';
    },7000);
  }
  // Every sound is tied to the slide actually being on screen right now, never to background
  // polling, so what you hear always matches what you're looking at.
  if(item.kind==='birthday'&&item.daysUntil===0&&shouldCelebrateBirthdayNow(item)){birthdayChime();burstConfetti()}
  else if(item.pendingAnnounce&&firstLoad===false){
    const k=keyFor(item);
    if(item.kind==='shoutout'){
      if(item.mentionsName||item.hasComment){
        // A named/commented shoutout needs to be noticeable from across the floor, not just a
        // quick blip - one long celebratory swell spanning the entire time this slide is on
        // screen, instead of firing it once at the start.
        burstConfetti();celebrationChime(item.durationMs||ROTATE_MS);
      }else{loudChime()}
    }
    else if(item.kind==='save'){chime();burstConfetti()}
    else if(item.kind==='shift-end-thanks'){loudChime();burstConfetti()}
    else if(item.kind==='daily-thanks'){loudChime();burstConfetti()}
    if(k)announcedKeys.add(k);
  }
}
// buildQueue() calls nextFillerItem(), which permanently advances the day's filler cursor -
// so it must only run at a moment the viewer will actually see, never on every 15s poll (that
// would silently churn through the pool behind the scenes while the dots/slide sit still,
// making the visible sequence feel arbitrary and the pool feel like it never progresses).
// latestSpotlight holds the freshest fetched data; rebuildQueue() is the ONLY place allowed
// to call buildQueue(), and it always shows the result immediately.
let latestSpotlight={},lastRealSignature='';
function realSignature(spotlight){
  const parts=[];
  (spotlight.shoutouts||[]).forEach(x=>parts.push(`s:${x.ticketId}`));
  (spotlight.saves||[]).forEach(x=>parts.push(`v:${x.ticketId}`));
  (spotlight.celebrations?.birthdays||[]).forEach(x=>parts.push(`b:${x.employeeName}:${x.daysUntil}`));
  (spotlight.celebrations?.anniversaries||[]).forEach(x=>parts.push(`a:${x.employeeName}:${x.daysUntil}`));
  (spotlight.callLeaders||[]).forEach(x=>parts.push(`l:${x.employeeName}:${x.accepted}`));
  (spotlight.shiftEndThanks||[]).forEach(x=>parts.push(`t:${x.employeeEmail}:${x.firedAt}`));
  if(spotlight.dailyThanks)parts.push(`d:${spotlight.dailyThanks.firedAt}`);
  if(spotlight.weather)parts.push(`w:${spotlight.weather.condition}:${spotlight.weather.level}`);
  return parts.join('|');
}
function rebuildQueue(){
  const{list}=buildQueue(latestSpotlight);
  queue=list;
  queueIndex=0;
  showSlide(0);
}
function startRotation(){
  clearTimeout(rotateTimer);
  rebuildQueue();
  scheduleNextSlide();
}
// Most slides share the fixed ROTATE_MS dwell time, but a few (e.g. an embedded video) need
// to stay on screen for their own actual length instead - a self-rescheduling setTimeout (vs.
// a single fixed setInterval) lets each slide say how long it needs before advancing.
function scheduleNextSlide(){
  clearTimeout(rotateTimer);
  const dwell=(queue[queueIndex]&&queue[queueIndex].durationMs)||ROTATE_MS;
  rotateTimer=setTimeout(()=>{
    const next=queueIndex+1;
    if(next>=queue.length){
      // Natural end of this cycle - the one safe, predictable moment to pull in fresh
      // filler picks, so the dots always match what is actually about to play.
      rebuildQueue();
    }else{
      queueIndex=next;showSlide(queueIndex);
    }
    scheduleNextSlide();
  },dwell);
}

async function load(){
  try{
    const key=params.get('key')?`?key=${encodeURIComponent(params.get('key'))}`:'';
    const data=await api(`/api/spotlight-wall${key}`);
    latestSpotlight=data.spotlight||{};
    const signature=realSignature(latestSpotlight);
    if(firstLoad){
      lastRealSignature=signature;
      startRotation();
      // On the very first load, mark everything already visible as "announced" so the wall
      // doesn't fire a chime for every pre-existing item the moment it opens - only genuinely
      // new arrivals after that get the sound.
      queue.forEach(item=>{const k=keyFor(item);if(k)announcedKeys.add(k)});
      firstLoad=false;
    }else if(signature!==lastRealSignature){
      // Genuinely new/changed real content (a new shoutout, updated weather, etc.) is worth
      // surfacing right away rather than waiting for the current cycle to finish.
      lastRealSignature=signature;
      rebuildQueue();
      scheduleNextSlide();
    }
    setMessage('','')
  }catch(error){
    setMessage(error.status===401?'This link is not authorized. Ask your administrator for the correct Spotlight Wall link.':`Could not load Spotlight Wall. ${error.response?.error||error.message}`,'error')
  }
}
function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString()}
// Re-fetches this page's own HTML (bypassing cache) every 5 minutes and reloads the tab the
// moment SW_VERSION no longer matches what's actually deployed - the fix for a display that's
// been open since before a deploy and would otherwise keep silently running yesterday's code.
async function checkForUpdate(){
  try{
    const response=await fetch(location.pathname+location.search,{cache:'no-store',credentials:'same-origin'});
    const html=await response.text();
    const match=html.match(/const SW_VERSION='([^']+)'/);
    if(match&&match[1]!==SW_VERSION)location.reload();
  }catch(_){/* a failed check is just retried on the next interval - nothing actionable here */}
}
load();
setInterval(load,15000);
setInterval(checkForUpdate,5*60*1000);
tickClock();
setInterval(tickClock,1000);
</script>
</body></html>
